name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: chronicler-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install maui-android

      - name: Read version
        id: version
        run: |
          APP_VERSION=$(grep '<ApplicationDisplayVersion>' src/Chronicler.Maui/Chronicler.Maui.csproj \
            | sed 's/.*>\(.*\)<.*/\1/' | head -n1)
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build API
        run: dotnet publish src/Chronicler.Api/Chronicler.Api.csproj -c Release

      - name: Build Android APK
        run: |
          dotnet publish src/Chronicler.Maui/Chronicler.Maui.csproj \
            -f net9.0-android \
            -c Release \
            -p:EmbedAssembliesIntoApk=true \
            -p:AndroidPackageFormat=apk

      - name: Stage APK
        run: |
          mkdir -p src/Chronicler.Api/updates
          APK=$(find . -name "*.apk" -not -name "*Signed*" | head -n1)
          VERSION=${{ steps.version.outputs.version }}
          cp "$APK" "src/Chronicler.Api/updates/Chronicler-v$VERSION.apk"
          cp "$APK" "src/Chronicler.Api/updates/Chronicler.apk"

      - name: Deploy
        env:
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: docker compose up -d --build

      - name: Health check
        run: |
          sleep 3
          curl -fsS http://localhost:5160/api/health
