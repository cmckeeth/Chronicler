name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: chronicler-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          # Native app versions use the full commit count.
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The self-hosted server provides Docker and the Android SDK.
      # deploy.sh builds the Kotlin APK, stages OTA updates, and deploys API + React.
      - name: Build native Android and deploy server
        env:
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: ./deploy.sh
