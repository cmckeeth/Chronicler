server {
    listen 5161;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the API container
    location /api/ {
        proxy_pass http://chronicler-api:5160/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
