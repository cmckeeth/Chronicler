server {
    listen 5161;
    root /usr/share/nginx/html;
    index index.html;

    # Allow cover-image uploads (pasted screenshots are often several MB; nginx's
    # default of 1m would 413 them before they reach the API).
    client_max_body_size 30m;

    # Proxy API calls to the API container
    location /api/ {
        proxy_pass http://chronicler-api:5160/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
